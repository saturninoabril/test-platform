  e2e-tests:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check, unit-tests]

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: change_user
          POSTGRES_PASSWORD: change_password
          POSTGRES_DB: test_e2e_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup test environment files
        run: |
          # Create fresh .env.test.e2e (don't copy .env.test to avoid duplicate keys)
          # Set database connection for E2E tests
          echo "DB_HOST=localhost" > .env.test.e2e
          echo "DB_PORT=5433" >> .env.test.e2e
          echo "DB_USER=change_user" >> .env.test.e2e
          echo "DB_PASSWORD=change_password" >> .env.test.e2e
          echo "DB_NAME=test_e2e_db" >> .env.test.e2e
          echo "NODE_ENV=test" >> .env.test.e2e
          echo "BASE_URL=http://localhost:3001" >> .env.test.e2e
          # Generate secrets for NextAuth and JWT
          AUTH_SECRET=$(openssl rand -base64 32)
          echo "AUTH_SECRET=$AUTH_SECRET" >> .env.test.e2e
          echo "AUTH_URL=http://localhost:3001" >> .env.test.e2e
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=$JWT_SECRET" >> .env.test.e2e
          echo "JWT_ISSUER=test-platform" >> .env.test.e2e
          # Generate test JWT tokens (export JWT_SECRET so generate-jwt can use it)
          export JWT_SECRET
          VALID_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "ci-service" -r "write:reports,admin" -e "90d")
          echo "VALID_JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.e2e
          echo "JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.e2e
          # Generate expired token (expires in 1 second)
          EXPIRED_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "expired-token" -r "write:reports" -e "1s")
          sleep 2
          echo "EXPIRED_JWT_TOKEN=$EXPIRED_JWT_TOKEN" >> .env.test.e2e
          echo "MAX_EVENT_PAYLOAD_SIZE=1048576" >> .env.test.e2e
          echo "PORT=3001" >> .env.test.e2e

      - name: Run E2E tests
        id: e2e-tests
        run: |
          # Ensure output file exists
          touch e2e-test-output.log
          npm run test:e2e 2>&1 | tee e2e-test-output.log || true
          # Verify file has content
          if [ ! -s e2e-test-output.log ]; then
            echo "Warning: Test output file is empty" | tee e2e-test-output.log
          fi
        continue-on-error: true
        env:
          CI: true

      - name: Parse E2E test results
        if: always()
        id: e2e-results
        run: |
          if [ -f e2e-test-output.log ]; then
            # Playwright format: "X passed (Ys)" or "X failed"
            PASSED=$(grep -oP '(\d+) passed' e2e-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            FAILED=$(grep -oP '(\d+) failed' e2e-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            SKIPPED=$(grep -oP '(\d+) skipped' e2e-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            TOTAL=$((PASSED + FAILED))

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            # Create description for status check
            if [ "$FAILED" -eq "0" ] && [ "$TOTAL" -gt "0" ]; then
              echo "description=$TOTAL/$TOTAL passed" >> $GITHUB_OUTPUT
            elif [ "$FAILED" -gt "0" ]; then
              echo "description=$PASSED/$TOTAL passed, $FAILED failed" >> $GITHUB_OUTPUT
            else
              echo "description=No tests found" >> $GITHUB_OUTPUT
            fi

            echo "## 🎭 E2E Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$PASSED" -eq "0" ] && [ "$FAILED" -eq "0" ] && [ "$SKIPPED" -gt "0" ]; then
              echo "⏭️ All $SKIPPED tests skipped" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -eq "0" ] && [ "$TOTAL" -gt "0" ]; then
              echo "✅ All $TOTAL tests passed" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -gt "0" ]; then
              echo "❌ $FAILED of $TOTAL tests failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Browser**: Chromium" >> $GITHUB_STEP_SUMMARY
            echo "- **Workers**: 1 (serial)" >> $GITHUB_STEP_SUMMARY
            echo "- **Database**: PostgreSQL 17.6 (TRUNCATE isolation)" >> $GITHUB_STEP_SUMMARY
          else
            # File doesn't exist - set default outputs
            echo "description=Test output not found" >> $GITHUB_OUTPUT
            FAILED=0
          fi

          # Exit with failure if tests failed
          if [ "$FAILED" -gt "0" ]; then
            echo "::error::$FAILED E2E tests failed"
            exit 1
          fi
          if [ "${{ steps.e2e-tests.outcome }}" != "success" ]; then
            echo "::error::E2E test step failed with outcome: ${{ steps.e2e-tests.outcome }}"
            exit 1
          fi

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Update commit status
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const description = '${{ steps.e2e-results.outputs.description }}' || 'Tests completed';
            const state = '${{ steps.e2e-results.outcome }}' === 'success' ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: 'E2E Tests',
              description: description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  playwright-artifact-upload:
    name: Playwright Artifact Upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, unit-tests]
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: change_user
          POSTGRES_PASSWORD: change_password
          POSTGRES_DB: playwright_artifact_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # Install main app dependencies and start server
      - name: Install main app dependencies
        run: npm ci

      - name: Setup test database
        run: |
          # Set database connection for artifact upload test
          # Use service name 'postgres' for Docker container networking
          echo "DB_HOST=postgres" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_USER=change_user" >> .env
          echo "DB_PASSWORD=change_password" >> .env
          echo "DB_NAME=playwright_artifact_test_db" >> .env
          echo "NODE_ENV=test" >> .env
          # Generate secrets for NextAuth and JWT
          AUTH_SECRET=$(openssl rand -base64 32)
          echo "AUTH_SECRET=$AUTH_SECRET" >> .env
          echo "AUTH_URL=http://localhost:3001" >> .env
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          # Generate JWT token and add to .env
          JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "test-script" -r "write:reports" -e "24h" 2>/dev/null)
          echo "JWT_TOKEN=$JWT_TOKEN" >> .env
          echo "API_URL=http://localhost:3001" >> .env

      - name: Push database schema
        run: npm run db:push

      - name: Start Next.js server
        run: |
          npm run dev &
          # Wait for server to be ready
          timeout 60 bash -c 'until curl -f http://localhost:3001/api/public > /dev/null 2>&1; do sleep 2; done'
        env:
          CI: true

      # Install test-run/playwright dependencies and run tests
      - name: Install Playwright test dependencies
        run: npm ci
        working-directory: ./test-run/playwright

      # Browsers are pre-installed in the Docker image, no need to install

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npm test
        working-directory: ./test-run/playwright

      - name: Upload test artifact to local API server
        if: always()
        run: |
          # Load JWT_TOKEN from .env file
          set -a
          . .env
          set +a

          # Create payload with artifact and GitHub metadata (read JSON from file to avoid arg list limit)
          PAYLOAD=$(jq \
            --arg framework "playwright" \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg headRef "${{ github.head_ref }}" \
            --arg baseRef "${{ github.base_ref }}" \
            --arg ref "${{ github.ref }}" \
            --arg actor "${{ github.actor }}" \
            --arg runId "${{ github.run_id }}" \
            --argjson runNumber "${{ github.run_number }}" \
            --argjson runAttempt "${{ github.run_attempt }}" \
            --arg job "${{ github.job }}" \
            --arg runner "${{ runner.name }}" \
            '{
              framework: $framework,
              artifact: .,
              githubRepository: $repo,
              githubSha: $sha,
              githubHeadRef: $headRef,
              githubBaseRef: $baseRef,
              githubRef: $ref,
              githubActor: $actor,
              githubRunId: $runId,
              githubRunNumber: $runNumber,
              githubRunAttempt: $runAttempt,
              githubJob: $job,
              runnerName: $runner
            }' test-run/playwright/results/json/test-results.json)

          # Send to local API server
          RESPONSE=$(curl -X POST "http://localhost:3001/api/test-reports" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $JWT_TOKEN" \
            -d "$PAYLOAD" \
            -w "\n%{http_code}" \
            -s)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          # Check if upload was successful (2xx status code)
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "✅ Artifact uploaded successfully"
            exit 0
          else
            echo "❌ Artifact upload failed"
            exit 1
          fi

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifact-upload-report
          path: test-run/playwright/results/
          retention-days: 30


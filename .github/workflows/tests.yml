name: Tests

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - main
      - 'release/*'

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting and format check
        id: check
        run: npm run check
        env:
          CI: true

  unit-tests:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: unit-tests
        run: |
          npm run test:unit 2>&1 | tee unit-test-output.log
        env:
          CI: true

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage
        continue-on-error: true
        env:
          CI: true

  api-tests:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: change_user
          POSTGRES_PASSWORD: change_password
          POSTGRES_DB: test_api_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment files
        run: |
          # Create fresh .env.test.api (don't copy .env.test to avoid duplicate keys)
          # Set database connection for API tests
          echo "DB_HOST=localhost" > .env.test.api
          echo "DB_PORT=5433" >> .env.test.api
          echo "DB_USER=change_user" >> .env.test.api
          echo "DB_PASSWORD=change_password" >> .env.test.api
          echo "DB_NAME=test_api_db" >> .env.test.api
          echo "NODE_ENV=test" >> .env.test.api
          echo "BASE_URL=http://localhost:3001" >> .env.test.api
          # Generate secrets for NextAuth and JWT
          AUTH_SECRET=$(openssl rand -base64 32)
          echo "AUTH_SECRET=$AUTH_SECRET" >> .env.test.api
          echo "AUTH_URL=http://localhost:3001" >> .env.test.api
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=$JWT_SECRET" >> .env.test.api
          echo "JWT_ISSUER=test-platform" >> .env.test.api
          # Generate test JWT tokens
          VALID_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "ci-service" -r "write:reports,admin" -e "90d" 2>/dev/null)
          echo "VALID_JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.api
          echo "JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.api
          # Generate expired token (expires in 1 second)
          EXPIRED_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "expired-token" -r "write:reports" -e "1s" 2>/dev/null)
          sleep 2
          echo "EXPIRED_JWT_TOKEN=$EXPIRED_JWT_TOKEN" >> .env.test.api
          echo "MAX_EVENT_PAYLOAD_SIZE=1048576" >> .env.test.api
          echo "PORT=3001" >> .env.test.api

      - name: Run API tests
        id: api-tests
        run: |
          npm run test:api 2>&1 | tee api-test-output.log
        continue-on-error: true
        env:
          CI: true

      - name: Parse API test results
        if: always()
        id: api-results
        run: |
          if [ -f api-test-output.log ]; then
            PASSED=$(grep -oP '(\d+) passed' api-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            FAILED=$(grep -oP '(\d+) failed' api-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            SKIPPED=$(grep -oP '(\d+) skipped' api-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            TOTAL=$((PASSED + FAILED))

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            echo "## 🔌 API Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$PASSED" -eq "0" ] && [ "$FAILED" -eq "0" ] && [ "$SKIPPED" -gt "0" ]; then
              echo "⏭️ All $SKIPPED tests skipped" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -eq "0" ] && [ "$TOTAL" -gt "0" ]; then
              echo "✅ All $TOTAL tests passed" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -gt "0" ]; then
              echo "❌ $FAILED of $TOTAL tests failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Exit with failure if tests failed
          if [ "${{ steps.api-tests.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-${{ github.run_number }}
          path: |
            tests/test-server-api.log
          retention-days: 30

  page-tests:
    name: Page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api-tests]
    
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: change_user
          POSTGRES_PASSWORD: change_password
          POSTGRES_DB: test_pages_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment files
        run: |
          # Create fresh .env.test.pages (don't copy .env.test to avoid duplicate keys)
          # Set database connection for page tests
          echo "DB_HOST=localhost" > .env.test.pages
          echo "DB_PORT=5433" >> .env.test.pages
          echo "DB_USER=change_user" >> .env.test.pages
          echo "DB_PASSWORD=change_password" >> .env.test.pages
          echo "DB_NAME=test_pages_db" >> .env.test.pages
          echo "NODE_ENV=test" >> .env.test.pages
          echo "BASE_URL=http://localhost:3001" >> .env.test.pages
          # Generate secrets for NextAuth and JWT
          AUTH_SECRET=$(openssl rand -base64 32)
          echo "AUTH_SECRET=$AUTH_SECRET" >> .env.test.pages
          echo "AUTH_URL=http://localhost:3001" >> .env.test.pages
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=$JWT_SECRET" >> .env.test.pages
          echo "JWT_ISSUER=test-platform" >> .env.test.pages
          # Generate test JWT tokens
          VALID_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "ci-service" -r "write:reports,admin" -e "90d" 2>/dev/null)
          echo "VALID_JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.pages
          echo "JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.pages
          # Generate expired token (expires in 1 second)
          EXPIRED_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "expired-token" -r "write:reports" -e "1s" 2>/dev/null)
          sleep 2
          echo "EXPIRED_JWT_TOKEN=$EXPIRED_JWT_TOKEN" >> .env.test.pages
          echo "MAX_EVENT_PAYLOAD_SIZE=1048576" >> .env.test.pages
          echo "PORT=3001" >> .env.test.pages

      - name: Run page tests
        id: page-tests
        run: |
          npm run test:pages 2>&1 | tee page-test-output.log
        continue-on-error: true
        env:
          CI: true

      - name: Parse page test results
        if: always()
        id: page-results
        run: |
          if [ -f page-test-output.log ]; then
            PASSED=$(grep -oP '(\d+) passed' page-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            FAILED=$(grep -oP '(\d+) failed' page-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            SKIPPED=$(grep -oP '(\d+) skipped' page-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            TOTAL=$((PASSED + FAILED))

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            echo "## 📄 Page Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$PASSED" -eq "0" ] && [ "$FAILED" -eq "0" ] && [ "$SKIPPED" -gt "0" ]; then
              echo "⏭️ All $SKIPPED tests skipped" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -eq "0" ] && [ "$TOTAL" -gt "0" ]; then
              echo "✅ All $TOTAL tests passed" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -gt "0" ]; then
              echo "❌ $FAILED of $TOTAL tests failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Exit with failure if tests failed
          if [ "${{ steps.page-tests.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Upload page test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pages-${{ github.run_number }}
          path: |
            tests/test-server-pages.log
          retention-days: 30

  e2e-tests:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - check
      - unit-tests
      - api-tests
      - page-tests

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: change_user
          POSTGRES_PASSWORD: change_password
          POSTGRES_DB: test_e2e_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup test environment files
        run: |
          # Create fresh .env.test.e2e (don't copy .env.test to avoid duplicate keys)
          # Set database connection for E2E tests
          echo "DB_HOST=localhost" > .env.test.e2e
          echo "DB_PORT=5433" >> .env.test.e2e
          echo "DB_USER=change_user" >> .env.test.e2e
          echo "DB_PASSWORD=change_password" >> .env.test.e2e
          echo "DB_NAME=test_e2e_db" >> .env.test.e2e
          echo "NODE_ENV=test" >> .env.test.e2e
          echo "BASE_URL=http://localhost:3001" >> .env.test.e2e
          # Generate secrets for NextAuth and JWT
          AUTH_SECRET=$(openssl rand -base64 32)
          echo "AUTH_SECRET=$AUTH_SECRET" >> .env.test.e2e
          echo "AUTH_URL=http://localhost:3001" >> .env.test.e2e
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=$JWT_SECRET" >> .env.test.e2e
          echo "JWT_ISSUER=test-platform" >> .env.test.e2e
          # Generate test JWT tokens
          VALID_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "ci-service" -r "write:reports,admin" -e "90d" 2>/dev/null)
          echo "VALID_JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.e2e
          echo "JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.e2e
          # Generate expired token (expires in 1 second)
          EXPIRED_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "expired-token" -r "write:reports" -e "1s" 2>/dev/null)
          sleep 2
          echo "EXPIRED_JWT_TOKEN=$EXPIRED_JWT_TOKEN" >> .env.test.e2e
          echo "MAX_EVENT_PAYLOAD_SIZE=1048576" >> .env.test.e2e
          echo "PORT=3001" >> .env.test.e2e

      - name: Run E2E tests
        id: e2e-tests
        run: |
          npm run test:e2e 2>&1 | tee e2e-test-output.log
        continue-on-error: true
        env:
          CI: true

      - name: Parse E2E test results
        if: always()
        id: e2e-results
        run: |
          if [ -f e2e-test-output.log ]; then
            # Playwright format: "X passed (Ys)" or "X failed"
            PASSED=$(grep -oP '(\d+) passed' e2e-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            FAILED=$(grep -oP '(\d+) failed' e2e-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            SKIPPED=$(grep -oP '(\d+) skipped' e2e-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            TOTAL=$((PASSED + FAILED))

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            echo "## 🎭 E2E Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$PASSED" -eq "0" ] && [ "$FAILED" -eq "0" ] && [ "$SKIPPED" -gt "0" ]; then
              echo "⏭️ All $SKIPPED tests skipped" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -eq "0" ] && [ "$TOTAL" -gt "0" ]; then
              echo "✅ All $TOTAL tests passed" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -gt "0" ]; then
              echo "❌ $FAILED of $TOTAL tests failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Browser**: Chromium" >> $GITHUB_STEP_SUMMARY
            echo "- **Workers**: 1 (serial)" >> $GITHUB_STEP_SUMMARY
            echo "- **Database**: PostgreSQL 17.6 (TRUNCATE isolation)" >> $GITHUB_STEP_SUMMARY
          fi

          # Exit with failure if tests failed
          if [ "${{ steps.e2e-tests.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checkStatus = '${{ needs.check.result }}';
            const unitStatus = '${{ needs.unit-tests.result }}';
            const apiStatus = '${{ needs.api-tests.result }}';
            const pageStatus = '${{ needs.page-tests.result }}';
            const e2eStatus = '${{ steps.e2e-tests.outcome }}';

            const statusIcon = (status) => status === 'success' ? '✅' : '❌';
            const allPassed = [checkStatus, unitStatus, apiStatus, pageStatus, e2eStatus].every(s => s === 'success');

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let message = `## 🧪 Test Results - Run #${context.runNumber}\n\n`;

            if (allPassed) {
              message += '### ✅ All Checks and Tests Passed!\n\n';
            } else {
              message += '### ❌ Some Checks or Tests Failed\n\n';
            }

            message += '| Check/Test Suite | Status |\n';
            message += '|------------------|--------|\n';
            message += `| Code Quality (Lint + Format) | ${statusIcon(checkStatus)} ${checkStatus} |\n`;
            message += `| Unit Tests | ${statusIcon(unitStatus)} ${unitStatus} |\n`;
            message += `| API Tests | ${statusIcon(apiStatus)} ${apiStatus} |\n`;
            message += `| Page Tests | ${statusIcon(pageStatus)} ${pageStatus} |\n`;
            message += `| E2E Tests | ${statusIcon(e2eStatus)} ${e2eStatus} |\n\n`;

            message += `### Test Artifacts\n`;
            message += `- [View Full Test Report](${runUrl})\n`;
            message += `- [Download Unit Coverage](${runUrl}#artifacts)\n`;
            message += `- [Download API Test Logs](${runUrl}#artifacts)\n`;
            message += `- [Download Page Test Logs](${runUrl}#artifacts)\n`;
            message += `- [Download E2E Report & Screenshots](${runUrl}#artifacts)\n\n`;

            message += `### Test Configuration\n`;
            message += `- **Framework**: Playwright 1.48 + Vitest 4.0.9\n`;
            message += `- **Database**: PostgreSQL 17.6\n`;
            message += `- **Node.js**: 24.11.1 LTS\n`;
            message += `- **Isolation**: Transaction rollback (Vitest) + TRUNCATE (E2E)\n\n`;

            message += `_Test artifacts retained for 30 days_`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🧪 Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }

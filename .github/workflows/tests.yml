name: Tests

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - main
      - 'release/*'

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting and format check
        id: check
        run: npm run check
        env:
          CI: true

  unit-tests:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: unit-tests
        run: |
          npm run test:unit 2>&1 | tee unit-test-output.log
        env:
          CI: true

      - name: Run unit tests with coverage
        id: unit-coverage
        run: npm run test:unit:coverage 2>&1 | tee unit-coverage-output.log
        continue-on-error: true
        env:
          CI: true

      - name: Parse unit test results
        if: always()
        id: unit-results
        run: |
          PASSED=0
          FAILED=0
          COVERAGE=0

          if [ -f unit-test-output.log ]; then
            PASSED=$(grep -oP '(\d+) passed' unit-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            FAILED=$(grep -oP '(\d+) failed' unit-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
          fi

          if [ -f unit-coverage-output.log ]; then
            # Extract first percentage (Statements coverage) from coverage table
            COVERAGE=$(grep "All files" unit-coverage-output.log | awk '{print $4}' | head -1 || echo "0")
            echo "DEBUG: Extracted coverage: $COVERAGE"
          else
            echo "DEBUG: Coverage output file not found"
          fi

          TOTAL=$((PASSED + FAILED))

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

          # Create description for status check
          if [ "$FAILED" -eq "0" ] && [ "$TOTAL" -gt "0" ]; then
            # Compare coverage with target (using bc for decimal comparison)
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "0" ]; then
              if awk "BEGIN {exit !($COVERAGE >= 80)}"; then
                echo "description=$TOTAL/$TOTAL passed, code coverage: $COVERAGE% (>80% target)" >> $GITHUB_OUTPUT
              else
                echo "description=$TOTAL/$TOTAL passed, code coverage: $COVERAGE% (<80% target)" >> $GITHUB_OUTPUT
              fi
            else
              echo "description=$TOTAL/$TOTAL passed" >> $GITHUB_OUTPUT
            fi
          elif [ "$FAILED" -gt "0" ]; then
            # Include coverage info even when tests fail
            if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "0" ]; then
              if awk "BEGIN {exit !($COVERAGE >= 80)}"; then
                echo "description=$PASSED/$TOTAL passed, $FAILED failed, code coverage: $COVERAGE% (>80% target)" >> $GITHUB_OUTPUT
              else
                echo "description=$PASSED/$TOTAL passed, $FAILED failed, code coverage: $COVERAGE% (<80% target)" >> $GITHUB_OUTPUT
              fi
            else
              echo "description=$PASSED/$TOTAL passed, $FAILED failed" >> $GITHUB_OUTPUT
            fi
          else
            echo "description=No tests found" >> $GITHUB_OUTPUT
          fi

          # Exit with failure if tests failed
          if [ "$FAILED" -gt "0" ]; then
            echo "::error::$FAILED unit tests failed"
            exit 1
          fi
          if [ "${{ steps.unit-tests.outcome }}" != "success" ]; then
            echo "::error::Unit test step failed with outcome: ${{ steps.unit-tests.outcome }}"
            exit 1
          fi

      - name: Update commit status
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const description = '${{ steps.unit-results.outputs.description }}' || 'Tests completed';
            const state = '${{ steps.unit-results.outcome }}' === 'success' ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: 'Unit Tests',
              description: description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  api-tests:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, unit-tests]

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: change_user
          POSTGRES_PASSWORD: change_password
          POSTGRES_DB: test_api_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment files
        run: |
          # Create fresh .env.test.api (don't copy .env.test to avoid duplicate keys)
          # Set database connection for API tests
          echo "DB_HOST=localhost" > .env.test.api
          echo "DB_PORT=5433" >> .env.test.api
          echo "DB_USER=change_user" >> .env.test.api
          echo "DB_PASSWORD=change_password" >> .env.test.api
          echo "DB_NAME=test_api_db" >> .env.test.api
          echo "NODE_ENV=test" >> .env.test.api
          echo "BASE_URL=http://localhost:3001" >> .env.test.api
          # Generate secrets for NextAuth and JWT
          AUTH_SECRET=$(openssl rand -base64 32)
          echo "AUTH_SECRET=$AUTH_SECRET" >> .env.test.api
          echo "AUTH_URL=http://localhost:3001" >> .env.test.api
          JWT_SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=$JWT_SECRET" >> .env.test.api
          echo "JWT_ISSUER=test-platform" >> .env.test.api
          # Generate test JWT tokens (export JWT_SECRET so generate-jwt can use it)
          export JWT_SECRET
          VALID_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "ci-service" -r "write:reports,admin" -e "90d")
          echo "VALID_JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.api
          echo "JWT_TOKEN=$VALID_JWT_TOKEN" >> .env.test.api
          # Generate expired token (expires in 1 second)
          EXPIRED_JWT_TOKEN=$(npm --silent run generate-jwt -- -q -s "expired-token" -r "write:reports" -e "1s")
          sleep 2
          echo "EXPIRED_JWT_TOKEN=$EXPIRED_JWT_TOKEN" >> .env.test.api
          echo "MAX_EVENT_PAYLOAD_SIZE=1048576" >> .env.test.api
          echo "PORT=3001" >> .env.test.api

      - name: Run API tests
        id: api-tests
        run: |
          # Ensure output file exists
          touch api-test-output.log
          npm run test:api 2>&1 | tee api-test-output.log || true
          # Verify file has content
          if [ ! -s api-test-output.log ]; then
            echo "Warning: Test output file is empty" | tee api-test-output.log
          fi
        continue-on-error: true
        env:
          CI: true

      - name: Parse API test results
        if: always()
        id: api-results
        run: |
          if [ -f api-test-output.log ]; then
            PASSED=$(grep -oP '(\d+) passed' api-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            FAILED=$(grep -oP '(\d+) failed' api-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            SKIPPED=$(grep -oP '(\d+) skipped' api-test-output.log | tail -1 | grep -oP '\d+' || echo "0")
            TOTAL=$((PASSED + FAILED))

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            # Create description for status check
            if [ "$FAILED" -eq "0" ] && [ "$TOTAL" -gt "0" ]; then
              echo "description=$TOTAL/$TOTAL passed" >> $GITHUB_OUTPUT
            elif [ "$FAILED" -gt "0" ]; then
              echo "description=$PASSED/$TOTAL passed, $FAILED failed" >> $GITHUB_OUTPUT
            else
              echo "description=No tests found" >> $GITHUB_OUTPUT
            fi

            echo "## 🔌 API Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$PASSED" -eq "0" ] && [ "$FAILED" -eq "0" ] && [ "$SKIPPED" -gt "0" ]; then
              echo "⏭️ All $SKIPPED tests skipped" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -eq "0" ] && [ "$TOTAL" -gt "0" ]; then
              echo "✅ All $TOTAL tests passed" >> $GITHUB_STEP_SUMMARY
            elif [ "$FAILED" -gt "0" ]; then
              echo "❌ $FAILED of $TOTAL tests failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
            fi
          else
            # File doesn't exist - set default outputs
            echo "description=Test output not found" >> $GITHUB_OUTPUT
            FAILED=0
          fi

          # Exit with failure if tests failed
          if [ "$FAILED" -gt "0" ]; then
            echo "::error::$FAILED API tests failed"
            exit 1
          fi
          if [ "${{ steps.api-tests.outcome }}" != "success" ]; then
            echo "::error::API test step failed with outcome: ${{ steps.api-tests.outcome }}"
            exit 1
          fi

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-${{ github.run_number }}
          path: |
            tests/test-server-api.log
          retention-days: 30

      - name: Update commit status
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const description = '${{ steps.api-results.outputs.description }}' || 'Tests completed';
            const state = '${{ steps.api-results.outcome }}' === 'success' ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: 'API Tests',
              description: description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });


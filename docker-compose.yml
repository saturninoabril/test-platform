# Use postgres/example user/password credentials

services:
  # PostgreSQL 17 for metadata storage
  postgres:
    image: postgres:17.6
    container_name: test-platform-postgres
    environment:
      POSTGRES_DB: change_db
      POSTGRES_USER: change_user
      POSTGRES_PASSWORD: change_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U change_user -d change_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-platform-network

  # Adminer for database management
  adminer:
    image: adminer:5.4.1
    container_name: test-platform-adminer
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-platform-network

volumes:
  postgres_data:
    driver: local

networks:
  test-platform-network:
    driver: bridge
